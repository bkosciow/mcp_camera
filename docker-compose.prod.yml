services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    ports:
      - "${APP_PORT:-8579}:8579"
      - "${MCP_PORT:-8580}:11001"
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERA_HOST=${CAMERA_HOST:-0.0.0.0}
      - CAMERA_PORT=${CAMERA_PORT:-8579}
      - CAMERA_MAX_WIDTH=${CAMERA_MAX_WIDTH:-1280}
      - CAMERA_JPEG_QUALITY=${CAMERA_JPEG_QUALITY:-85}
      - CAMERA_LOG_LEVEL=${CAMERA_LOG_LEVEL:-INFO}
      - CAMERA_PLACES=${CAMERA_PLACES:-default}
      - CAMERA_AUTH_TOKEN=${CAMERA_AUTH_TOKEN:?CAMERA_AUTH_TOKEN is required}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=11001
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
      - "/dev/video2:/dev/video2"
      - "/dev/video3:/dev/video3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

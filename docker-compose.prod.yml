services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${APP_PORT:-8579}:8579"
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERA_HOST=${CAMERA_HOST:-0.0.0.0}
      - CAMERA_PORT=${CAMERA_PORT:-8579}
      - CAMERA_MAX_WIDTH=${CAMERA_MAX_WIDTH:-1280}
      - CAMERA_JPEG_QUALITY=${CAMERA_JPEG_QUALITY:-85}
      - CAMERA_LOG_LEVEL=${CAMERA_LOG_LEVEL:-INFO}
    # USB camera device passthrough
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8579/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

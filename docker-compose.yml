services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    ports:
      - "8579:8579"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - CAMERA_HOST=0.0.0.0
      - CAMERA_PORT=8579
    # USB camera device passthrough (uncomment when camera is available)
    # devices:
    #   - /dev/video0:/dev/video0
    restart: unless-stopped
    command: uvicorn camera_mcp.main:app --host 0.0.0.0 --port 8579 --reload
